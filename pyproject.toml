[project]
name = "memagent"
version = "0.1.0"
description = "Memory agent evaluation and routing project"
requires-python = "==3.12.*"
dependencies = [
    "backoff==2.2.1",
    "datasets==5.0.0",
    "huggingface-hub==1.26.0",
    "joblib==1.5.2",
    "matplotlib==3.10.8",
    "networkx==3.5",
    "numpy==2.3.2",
    "openai==2.45.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.2",
    "qdrant-client==1.18.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "synthetic-conversation-generation==0.1.0",
    "tiktoken==0.11.0",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "hypothesis==6.163.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "asdrp/ecommerce_memeval_generator/synthetic-conversation-generation",
]

[tool.uv.sources]
synthetic-conversation-generation = { workspace = true }