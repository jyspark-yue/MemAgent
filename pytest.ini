[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep async fixtures on the same function scope used by this test suite.
asyncio_default_fixture_loop_scope = function

norecursedirs =
    old
    .git
    .hypothesis
    .venv
    .venv-python313-backup
    qdrant_storage
    results
    asdrp/classification_algorithms/runner_scripts/testing_runners

markers =
    unit: fast isolated tests that do not require external services
    integration: tests that exercise multiple project components together
    asyncio: asynchronous test
    live_api: tests that make real external API calls
    qdrant: tests that require a running Qdrant instance

addopts =
    --strict-markers